<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><title>Ville 3D</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#9fc4e8;font-family:system-ui,sans-serif;touch-action:none}
canvas{display:block}
#ui{position:fixed;left:0;right:0;bottom:0;padding:10px 10px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
button{background:#000a;color:#fff;border:1px solid #fff4;border-radius:10px;padding:10px 14px;font-size:14px}
button.off{opacity:.4}
#msg{position:fixed;top:calc(10px + env(safe-area-inset-top));left:10px;right:10px;color:#fff;background:#000a;border-radius:10px;padding:8px 12px;font-size:13px}
</style></head><body>
<div id="msg">Chargement…</div><div id="ui"></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9fc4e8);scene.fog=new THREE.Fog(0x9fc4e8,400,1800);
const cam=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.5,4000);
const r=new THREE.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,2));r.setSize(innerWidth,innerHeight);
r.outputEncoding=THREE.sRGBEncoding;document.body.prepend(r.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x667788,1.1));
const sun=new THREE.DirectionalLight(0xfff2dd,1.4);sun.position.set(200,400,150);scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(6000,6000),new THREE.MeshStandardMaterial({color:0x555a5e,roughness:1}));
ground.rotation.x=-Math.PI/2;ground.position.y=-0.2;scene.add(ground);
// ===== Petite ville : 4 modèles assemblés =====
const R2='https://pub-7b4d28c9c7ac495bb95eceec5b276d84.r2.dev/';
const HALF=150,ROAD_W=16,SW=4,CURB=0.25,INNER=ROAD_W/2+SW+1,Q=HALF-INNER-4,QC=INNER+Q/2;
const ui=document.getElementById('ui'),msg=document.getElementById('msg');
const loader=new THREE.GLTFLoader();let base=location.href.split('?')[0].split('#')[0];base=base.replace(/[^\/]*$/,'');
function box(w,h,d,x,y,z,c){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:c,roughness:.9}));m.position.set(x,y,z);return m}
function addBtn(n,get){const b=document.createElement('button');b.textContent=n;ui.appendChild(b);b.onclick=()=>{const o=get();if(!o)return;o.visible=!o.visible;b.classList.toggle('off',!o.visible)}}
// Routes en croix, trottoirs, bordures, marquages, îlots de fond
const streets=new THREE.Group(),L=HALF*2,off=ROAD_W/2+SW/2,len=HALF-ROAD_W/2-SW;
streets.add(box(L,.1,L,0,-.12,0,0x5b5f58),box(L,.1,ROAD_W,0,-.05,0,0x2b2d31),box(ROAD_W,.1,L,0,-.04,0,0x2b2d31));
for(const a of[-1,1])for(const b of[-1,1]){const mid=b*(ROAD_W/2+SW+len/2);
 streets.add(box(len,CURB,SW,mid,CURB/2,a*off,0x9a9a96),box(SW,CURB,len,a*off,CURB/2,mid,0x9a9a96),
 box(SW,CURB,SW,a*off,CURB/2,b*off,0x9a9a96),
 box(HALF-INNER,.15,HALF-INNER,a*(INNER+(HALF-INNER)/2),.075,b*(INNER+(HALF-INNER)/2),0x77786f))}
for(let i=-HALF+6;i<HALF;i+=12){if(Math.abs(i)<ROAD_W)continue;streets.add(box(5,.02,.3,i,.06,0,0xe8c547),box(.3,.02,5,0,.07,i,0xe8c547))}
scene.add(streets);addBtn('Routes',()=>streets);
// Nettoyage : points/lignes parasites, collisions, lightmaps, mer, matériaux alpha 0
function clean(root,re){const k=[];root.traverse(o=>{if(o.isPoints||o.isLine)k.push(o);else if(o.isMesh&&re&&(re.test(o.name)||re.test(o.parent&&o.parent.name||'')))k.push(o)});
 k.forEach(o=>o.parent&&o.parent.remove(o));
 root.traverse(o=>{if(o.isMesh)[].concat(o.material).forEach(m=>{if(m&&m.transparent&&m.opacity===0)m.visible=false})})}
// Mise à l'échelle dans un carré, socle à y=0, centrage, rotation
function place(o,{size,cx,cz,rotY=0,maxScale=Infinity}){o.rotation.y=rotY;o.updateMatrixWorld(true);
 let bx=new THREE.Box3().setFromObject(o),s=bx.getSize(new THREE.Vector3());o.scale.multiplyScalar(Math.min(size/Math.max(s.x,s.z),maxScale));
 o.updateMatrixWorld(true);bx=new THREE.Box3().setFromObject(o);const c=bx.getCenter(new THREE.Vector3());
 o.position.x+=cx-c.x;o.position.z+=cz-c.z;o.position.y+=-bx.min.y}
const items=[
 {f:'new_york_city.glb',n:'New York',opt:{size:Q,cx:QC,cz:-QC}},
 {f:'Untitled.glb',n:'Bâtiments',opt:{size:Q*.9,cx:-QC,cz:-QC,maxScale:1.2}},
 {f:'city.glb',n:'Rue',opt:{size:Q,cx:-QC,cz:QC,rotY:Math.PI/2}},
 {f:'traffic_slam_2_map.glb',n:'Carte',re:/collision|invisiblewall|lightmap|sea|water|ocean/i,opt:{size:Q,cx:QC,cz:QC}}];
let left=items.length;
function tryLoad(urls,onok,onerr,onprog){const u=urls.shift();loader.load(u,onok,onprog,()=>urls.length?tryLoad(urls,onok,onerr,onprog):onerr(u))}
items.forEach(it=>{addBtn(it.n,()=>it.obj);
 tryLoad([R2+it.f,base+'Models/'+it.f],g=>{const o=g.scene;clean(o,it.re);place(o,it.opt);scene.add(o);it.obj=o;
  if(--left==0)msg.textContent='Glisse = tourner · 2 doigts = zoom/déplacer'},
  u=>{msg.textContent='Erreur de chargement : '+u+' (CORS ou fichier absent ?)'},
  e=>{if(e.total)msg.textContent='Chargement '+it.n+' '+Math.round(e.loaded/e.total*100)+'%'})});
// Contrôles tactiles
let th=0.6,ph=1.0,dist=380;const tg=new THREE.Vector3(0,0,0);let pts=new Map(),last=0,lc=null;
const el=r.domElement;
el.onpointerdown=e=>{el.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);last=0};
el.onpointerup=el.onpointercancel=e=>{pts.delete(e.pointerId);last=0;lc=null};
el.onpointermove=e=>{if(!pts.has(e.pointerId))return;const p=pts.get(e.pointerId);const dx=e.clientX-p[0],dy=e.clientY-p[1];pts.set(e.pointerId,[e.clientX,e.clientY]);
 if(pts.size==1){th-=dx*0.006;ph=Math.min(1.5,Math.max(0.15,ph-dy*0.005))}
 else if(pts.size==2){const a=[...pts.values()],d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);
  if(last)dist=Math.min(1500,Math.max(10,dist*last/d));last=d;
  const k=dist*0.0015,mx=(dx/2),my=(dy/2);tg.x-=(Math.cos(th)*mx+Math.sin(th)*my)*k;tg.z-=(-Math.sin(th)*mx+Math.cos(th)*my)*k}};
el.onwheel=e=>{dist=Math.min(1500,Math.max(10,dist*(1+e.deltaY*0.001)))};
onresize=()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)};
(function loop(){requestAnimationFrame(loop);
 cam.position.set(tg.x+dist*Math.sin(ph)*Math.sin(th),tg.y+dist*Math.cos(ph),tg.z+dist*Math.sin(ph)*Math.cos(th));cam.lookAt(tg);r.render(scene,cam)})();
</script></body></html>
