<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><title>Ville 3D</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#9fc4e8;font-family:system-ui,sans-serif;touch-action:none}
canvas{display:block}
#ui{position:fixed;left:0;right:0;bottom:0;padding:10px 10px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
button{background:#000a;color:#fff;border:1px solid #fff4;border-radius:10px;padding:10px 14px;font-size:14px}
button.off{opacity:.4}
#msg{position:fixed;top:calc(10px + env(safe-area-inset-top));left:10px;right:10px;color:#fff;background:#000a;border-radius:10px;padding:8px 12px;font-size:13px}
</style></head><body>
<div id="msg">Chargement…</div><div id="ui"></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9fc4e8);scene.fog=new THREE.Fog(0x9fc4e8,400,1800);
const cam=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.5,4000);
const r=new THREE.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,2));r.setSize(innerWidth,innerHeight);
r.outputEncoding=THREE.sRGBEncoding;document.body.prepend(r.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x667788,1.1));
const sun=new THREE.DirectionalLight(0xfff2dd,1.4);sun.position.set(200,400,150);scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(6000,6000),new THREE.MeshStandardMaterial({color:0x555a5e,roughness:1}));
ground.rotation.x=-Math.PI/2;ground.position.y=-0.2;scene.add(ground);
// Modèles : largeur cible (m) et position
const items=[
 {f:'traffic_slam_2_map.glb',n:'Carte',w:500,x:0,z:0},
 {f:'city.glb',n:'Rue',w:120,x:360,z:0},
 {f:'Untitled.glb',n:'Bâtiments',w:100,x:-340,z:0}];
const ui=document.getElementById('ui'),msg=document.getElementById('msg');let left=items.length;
const loader=new THREE.GLTFLoader();
items.forEach(it=>{
 const b=document.createElement('button');b.textContent=it.n;ui.appendChild(b);
 b.onclick=()=>{if(!it.obj)return;it.obj.visible=!it.obj.visible;b.classList.toggle('off',!it.obj.visible)};
 loader.load('Models/'+it.f,g=>{
  const o=g.scene;let bx=new THREE.Box3().setFromObject(o),s=bx.getSize(new THREE.Vector3());
  o.scale.setScalar(it.w/Math.max(s.x,s.z));bx=new THREE.Box3().setFromObject(o);const c=bx.getCenter(new THREE.Vector3());
  o.position.set(it.x-c.x,-bx.min.y,it.z-c.z);scene.add(o);it.obj=o;
  if(--left==0)msg.textContent='Glisse = tourner · 2 doigts = zoom/déplacer';
 },e=>{if(e.total)msg.textContent='Chargement '+it.n+' '+Math.round(e.loaded/e.total*100)+'%'},
 ()=>{msg.textContent='Erreur : '+it.f+' introuvable ('+location.href+'Models/'+it.f+')'});
});
// Contrôles tactiles
let th=0.6,ph=1.0,dist=500;const tg=new THREE.Vector3(0,0,0);let pts=new Map(),last=0,lc=null;
const el=r.domElement;
el.onpointerdown=e=>{el.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);last=0};
el.onpointerup=el.onpointercancel=e=>{pts.delete(e.pointerId);last=0;lc=null};
el.onpointermove=e=>{if(!pts.has(e.pointerId))return;const p=pts.get(e.pointerId);const dx=e.clientX-p[0],dy=e.clientY-p[1];pts.set(e.pointerId,[e.clientX,e.clientY]);
 if(pts.size==1){th-=dx*0.006;ph=Math.min(1.5,Math.max(0.15,ph-dy*0.005))}
 else if(pts.size==2){const a=[...pts.values()],d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);
  if(last)dist=Math.min(1500,Math.max(10,dist*last/d));last=d;
  const k=dist*0.0015,mx=(dx/2),my=(dy/2);tg.x-=(Math.cos(th)*mx+Math.sin(th)*my)*k;tg.z-=(-Math.sin(th)*mx+Math.cos(th)*my)*k}};
el.onwheel=e=>{dist=Math.min(1500,Math.max(10,dist*(1+e.deltaY*0.001)))};
onresize=()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)};
(function loop(){requestAnimationFrame(loop);
 cam.position.set(tg.x+dist*Math.sin(ph)*Math.sin(th),tg.y+dist*Math.cos(ph),tg.z+dist*Math.sin(ph)*Math.cos(th));cam.lookAt(tg);r.render(scene,cam)})();
</script></body></html>
