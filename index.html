<style>

canvas{display:block;touch-action:none}

</style></head><body>
<div id="msg">Chargement…</div>
<div id="top"><button id="bm">Échelle −</button><button id="bp">Échelle +</button><button id="bs">Départ</button></div>
<div id="joy"><div id="knob"></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
// ===== Scène =====
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9fc4e8);scene.fog=new THREE.Fog(0x9fc4e8,250,1500);
const cam=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,0.2,4000);
const r=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});
r.setPixelRatio(Math.min(devicePixelRatio||1,1.5));r.setSize(innerWidth,innerHeight);r.outputEncoding=THREE.sRGBEncoding;
document.body.prepend(r.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x667788,0.75));
const sun=new THREE.DirectionalLight(0xfff2dd,0.9);sun.position.set(200,400,150);scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(6000,6000),new THREE.MeshStandardMaterial({color:0x4a4e52,roughness:1}));
ground.rotation.x=-Math.PI/2;scene.add(ground);
const msg=document.getElementById('msg');
const R2='https://pub-7b4d28c9c7ac495bb95eceec5b276d84.r2.dev/';
const loader=new THREE.GLTFLoader();let base=location.href.split('?')[0].split('#')[0];base=base.replace(/[^\/]*$/,'');

// ===== Utilitaires de chargement (identiques à avant) =====
function clean(root){const k=[];root.traverse(o=>{if(o.isPoints||o.isLine)k.push(o)});k.forEach(o=>o.parent&&o.parent.remove(o));
 root.traverse(o=>{if(o.isMesh)[].concat(o.material).forEach(m=>{if(m&&m.transparent&&m.opacity===0)m.visible=false})})}
function lighten(o){const v=new THREE.Vector3();o.traverse(c=>{if(!c.isMesh||!c.geometry)return;
 const g=c.geometry,tri=(g.index?g.index.count:g.attributes.position.count)/3;
 if(tri>8000){g.computeBoundingBox();g.boundingBox.getSize(v);if(v.length()<10)c.visible=false}});
 o.updateMatrixWorld(true);o.traverse(c=>{c.matrixAutoUpdate=false})}
function tryLoad(urls,onok,onerr,onprog){const u=urls.shift();loader.load(u,onok,onprog,()=>urls.length?tryLoad(urls,onok,onerr,onprog):onerr(u))}

// ===== Personnages (prototype en formes simples, 1,8 m) =====
const G={torso:new THREE.BoxGeometry(.5,.6,.28),head:new THREE.SphereGeometry(.17,10,8),
 leg:new THREE.BoxGeometry(.18,.9,.18).translate(0,-.45,0),arm:new THREE.BoxGeometry(.14,.6,.14).translate(0,-.3,0),face:new THREE.BoxGeometry(.2,.06,.04)};
function makeHuman(shirt,pants,skin){
 const M=c=>new THREE.MeshStandardMaterial({color:c,roughness:.8}),g=new THREE.Group();
 const mS=M(shirt),mP=M(pants),mK=M(skin);
 const torso=new THREE.Mesh(G.torso,mS);torso.position.y=1.2;
 const head=new THREE.Mesh(G.head,mK);head.position.y=1.67;
 const face=new THREE.Mesh(G.face,M(0x222222));face.position.set(0,1.69,.15);
 const legL=new THREE.Mesh(G.leg,mP),legR=new THREE.Mesh(G.leg,mP);legL.position.set(-.13,.9,0);legR.position.set(.13,.9,0);
 const armL=new THREE.Mesh(G.arm,mS),armR=new THREE.Mesh(G.arm,mS);armL.position.set(-.34,1.48,0);armR.position.set(.34,1.48,0);
 g.add(torso,head,face,legL,legR,armL,armR);g.userData={legL,legR,armL,armR,ph:Math.random()*6};return g}
function animate(h,dt,spd){const u=h.userData;u.ph+=dt*(3+spd*1.6);const a=Math.min(.9,spd*.22)*Math.sin(u.ph);
 u.legL.rotation.x=a;u.legR.rotation.x=-a;u.armL.rotation.x=-a;u.armR.rotation.x=a}
function turnTo(cur,tgt,k){let d=tgt-cur;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return cur+d*Math.min(1,k)}

// ===== Ville : new_york_city.glb répété en 3x3 (miroirs = routes qui se raccordent) =====
const TARGET=350,TILES=3; // largeur d'un bloc en mètres (échelle validée) et nombre de blocs par côté
let wrap=null,box0=null,s0=1,uf=1,MAP=null,sky=null;
try{uf=parseFloat(localStorage.getItem('ny_scale'))||1}catch(e){}
const SH=11,N=1<<SH,NN=N*N;
const ortho=new THREE.OrthographicCamera(-1,1,1,-1,.1,100);
const rt=new THREE.WebGLRenderTarget(N,N,{minFilter:THREE.NearestFilter,magFilter:THREE.NearestFilter,format:THREE.RGBAFormat,type:THREE.UnsignedByteType});
const hmat=new THREE.ShaderMaterial({uniforms:{uMin:{value:0},uRange:{value:1}},side:THREE.DoubleSide,
 vertexShader:'varying float vY;uniform float uMin;uniform float uRange;void main(){vec4 w=modelMatrix*vec4(position,1.0);vY=(w.y-uMin)/uRange;gl_Position=projectionMatrix*viewMatrix*w;}',
 fragmentShader:'varying float vY;void main(){float a=clamp(vY,0.0,0.9999)*255.0;float hi=floor(a);gl_FragColor=vec4(hi/255.0,a-hi,0.0,1.0);}'});
let BUF=null,HH=null,HAS=null,WALK=null,SAFE=null,TMP=null,QQ=null;

// --- Variation : on échange des bâtiments du fichier entre eux (empreintes proches) ---
function findUnits(o){let n=o;for(let d=0;d<6;d++){while(n.children.length===1)n=n.children[0];if(n.children.length>=8)return n;
 let best=null,bc=0;n.children.forEach(c=>{const k=c.children.length;if(k>bc){bc=k;best=c}});if(!best)return null;n=best}return null}
function pathOf(o,n){const p=[];while(n!==o){p.unshift(n.parent.children.indexOf(n));n=n.parent}return p}
function nodeAt(o,p){let n=o;for(const k of p)n=n.children[k];return n}
function makeSlots(o,sz){const un=findUnits(o);if(!un)return null;const lim=Math.max(sz.x,sz.z),slots=[];
 un.children.forEach((c,k)=>{const b=new THREE.Box3().setFromObject(c);if(b.isEmpty())return;const v=b.getSize(new THREE.Vector3()),ct=b.getCenter(new THREE.Vector3());
  if(Math.max(v.x,v.z)<lim*.3&&v.y>lim*.04&&Math.abs(ct.x)<sz.x*.42&&Math.abs(ct.z)<sz.z*.42)slots.push({k,w:v.x,d:v.z,cx:ct.x,cz:ct.z,y0:b.min.y,mw:c.matrixWorld.clone()})});
 return slots.length>=6?{path:pathOf(o,un),slots}:null}
function fillTile(tg,o,info){const t=o.clone(true);tg.add(t);if(!info)return;const par=nodeAt(t,info.path),src=nodeAt(o,info.path),S=info.slots;
 for(const a of S){if(Math.random()>.55)continue;
  const cand=S.filter(b=>b!==a&&b.w<=a.w*1.1&&b.d<=a.d*1.1&&b.w>=a.w*.6&&b.d>=a.d*.6);if(!cand.length)continue;
  const b=pick(cand),c=src.children[b.k].clone(true),th=Math.random()<.5?0:Math.PI,m4=new THREE.Matrix4();
  const M=m4.makeTranslation(a.cx,a.y0,a.cz).multiply(new THREE.Matrix4().makeRotationY(th)).multiply(new THREE.Matrix4().makeTranslation(-b.cx,-b.y0,-b.cz)).multiply(b.mw);
  c.matrix.copy(M);c.matrixAutoUpdate=false;c.matrixWorldNeedsUpdate=true;par.children[a.k].visible=false;tg.add(c)}}

// --- Skyline lointain (cubes en un seul appel de dessin, noyés dans la brume) ---
function placeSky(halfCity){
 if(!sky){sky=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1).translate(0,.5,0),new THREE.MeshStandardMaterial({roughness:1}),320);sky.frustumCulled=false;scene.add(sky)}
 const m=new THREE.Matrix4(),q=new THREE.Quaternion(),c=new THREE.Color();let k=0;const R=halfCity+1300;
 while(k<320){const x=(Math.random()*2-1)*R,z=(Math.random()*2-1)*R;if(Math.abs(x)<halfCity+60&&Math.abs(z)<halfCity+60)continue;
  const w=30+Math.random()*50,h=40+Math.pow(Math.random(),2)*260,d=30+Math.random()*50;
  q.setFromAxisAngle(new THREE.Vector3(0,1,0),Math.random()*3);m.compose(new THREE.Vector3(x,MAP?MAP.g-.3:0,z),q,new THREE.Vector3(w,h,d));
  sky.setMatrixAt(k,m);c.setHSL(.58,.12,.42+Math.random()*.25);sky.setColorAt(k,c);k++}
 sky.instanceMatrix.needsUpdate=true;sky.instanceColor.needsUpdate=true}

// Carte des hauteurs vue du dessus (sol, collisions, caméra)
function buildMap(){
 const s=s0*uf;wrap.scale.setScalar(s);wrap.updateMatrixWorld(true);
 const W=box0.x*TILES*s,D=box0.z*TILES*s,sy=box0.y*s,S=Math.max(W,D)+4,half=S/2;
 hmat.uniforms.uMin.value=0;hmat.uniforms.uRange.value=sy+2;
 ortho.left=-half;ortho.right=half;ortho.top=half;ortho.bottom=-half;ortho.near=.1;ortho.far=sy+30;ortho.updateProjectionMatrix();
 ortho.position.set(0,sy+10,0);ortho.up.set(0,0,-1);ortho.lookAt(0,0,0);ortho.updateMatrixWorld(true);
 const oc=new THREE.Color();r.getClearColor(oc);const oa=r.getClearAlpha(),ob=scene.background,of=scene.fog;
 ground.visible=false;P.m.visible=false;npcGroup.visible=false;if(sky)sky.visible=false;scene.background=null;scene.fog=null;scene.overrideMaterial=hmat;
 r.setClearColor(0x000000,0);r.setRenderTarget(rt);r.render(scene,ortho);
 if(!BUF){BUF=new Uint8Array(NN*4);HH=new Float32Array(NN);HAS=new Uint8Array(NN);WALK=new Uint8Array(NN);SAFE=new Uint8Array(NN);TMP=new Uint8Array(NN);QQ=new Int32Array(NN)}
 r.readRenderTargetPixels(rt,0,0,N,N,BUF);
 r.setRenderTarget(null);scene.overrideMaterial=null;scene.background=ob;scene.fog=of;r.setClearColor(oc,oa);
 ground.visible=true;P.m.visible=true;npcGroup.visible=true;if(sky)sky.visible=true;
 const cell=S/N,H=HH,has=HAS,walk=WALK,bins={};walk.fill(0);const rg=sy+2;
 for(let k=0;k<NN;k++){if(BUF[k*4+3]===0){has[k]=0;continue}has[k]=1;H[k]=((BUF[k*4]+BUF[k*4+1]/255)/255)*rg;const b=Math.round(H[k]/.75);bins[b]=(bins[b]||0)+1}
 let bb=0,bn=-1;for(const b in bins)if(bins[b]>bn){bn=bins[b];bb=+b}
 const g=bb*.75;
 // Zone marchable = tout ce qui est relié au niveau de la rue par des pentes douces / marches (< 0,6 m par cellule)
 let qt=0,qh=0;
 for(let k=0;k<NN;k++)if(has[k]&&Math.abs(H[k]-g)<=.9){walk[k]=1;QQ[qt++]=k}
 const lo=g-4,hi=g+6;
 while(qh<qt){const k=QQ[qh++],i=k&(N-1),j=k>>SH,h=H[k];
  for(let d=0;d<4;d++){let nk;
   if(d===0){if(i===0)continue;nk=k-1}else if(d===1){if(i===N-1)continue;nk=k+1}else if(d===2){if(j===0)continue;nk=k-N}else{if(j===N-1)continue;nk=k+N}
   if(walk[nk]||!has[nk])continue;const hn=H[nk];if(hn<lo||hn>hi||Math.abs(hn-h)>.6)continue;walk[nk]=1;QQ[qt++]=nk}}
 const wc=qt;
 // Cellules "sûres" (1 m de marge) pour faire apparaître le joueur et les PNJ
 TMP.fill(0);SAFE.fill(0);
 for(let j=0;j<N;j++){const row=j*N;for(let i=2;i<N-2;i++)TMP[row+i]=walk[row+i-2]&walk[row+i-1]&walk[row+i]&walk[row+i+1]&walk[row+i+2]}
 let ns=0;for(let j=2;j<N-2;j++){const row=j*N;for(let i=0;i<N;i++){const v=TMP[row-2*N+i]&TMP[row-N+i]&TMP[row+i]&TMP[row+N+i]&TMP[row+2*N+i];SAFE[row+i]=v;ns+=v}}
 const list=new Int32Array(ns);let p=0;for(let k=0;k<NN;k++)if(SAFE[k])list[p++]=k;
 MAP={cell,x0:-half,z0:half,H,has,walk,safe:SAFE,list,g,free:wc<50||ns<10,W,D,sy};
 ground.position.y=g-.3;placeSky(Math.max(W,D)/2)
}
function cellAt(x,z){const i=Math.floor((x-MAP.x0)/MAP.cell),j=Math.floor((MAP.z0-z)/MAP.cell);return(i<0||j<0||i>=N||j>=N)?-1:j*N+i}
function cellXZ(k){const i=k&(N-1),j=k>>SH;return[MAP.x0+(i+.5)*MAP.cell,MAP.z0-(j+.5)*MAP.cell]}
const OFF=[[0,0],[.3,0],[-.3,0],[0,.3],[0,-.3]];
function canStand(x,z){if(MAP.free)return true;for(const o of OFF){const k=cellAt(x+o[0],z+o[1]);if(k<0||!MAP.walk[k])return false}return true}
function groundAt(x,z){const k=cellAt(x,z);return(k>=0&&MAP.walk[k])?MAP.H[k]:MAP.g}
function topAt(x,z){const k=cellAt(x,z);return(k>=0&&MAP.has[k])?MAP.H[k]:-1e9}

// ===== Joueur + PNJ =====
const P={m:makeHuman(0xd8412f,0x2b3a55,0xe0b48f),x:0,y:0,z:0,face:0,spd:0};scene.add(P.m);
const npcGroup=new THREE.Group();scene.add(npcGroup);let npcs=[];
const SHIRT=[0x3b6ea5,0x6a8f3c,0xe0a030,0x8a4fb0,0xc0c0c0,0x2f2f2f,0xb04040,0x30a0a0,0xf0f0f0],PANTS=[0x222831,0x3a3a3a,0x4a5a7a,0x6b5a40,0x1e2a44],SKIN=[0xf0c8a0,0xd9a577,0xa66e45,0x6b432a];
const pick=a=>a[Math.floor(Math.random()*a.length)];
function spawn(){
 npcs.forEach(n=>npcGroup.remove(n.m));npcs=[];
 let best=-1,bd=1e18;const L=MAP.list;
 for(let a=0;a<L.length;a++){const[x,z]=cellXZ(L[a]),d=x*x+z*z;if(d<bd){bd=d;best=L[a]}}
 if(best>=0){const[x,z]=cellXZ(best);P.x=x;P.z=z}else{P.x=0;P.z=0}
 P.y=groundAt(P.x,P.z);yaw=0;pitch=.28;camDist=wantDist;
 let tries=0;
 while(npcs.length<45&&L.length&&tries++<20000){const k=L[Math.floor(Math.random()*L.length)],[x,z]=cellXZ(k),d=Math.hypot(x-P.x,z-P.z);
  if(d<6||d>260)continue;
  const m=makeHuman(pick(SHIRT),pick(PANTS),pick(SKIN));m.scale.setScalar(.95+Math.random()*.12);npcGroup.add(m);
  npcs.push({m,x,z,y:groundAt(x,z),h:Math.random()*6.28,rot:0,t:Math.random()*4,v:1.1+Math.random()*.7,spd:0})}
}
function updateNPC(n,dt){
 n.t-=dt;if(n.t<0){n.h+=(Math.random()-.5)*1.4;n.t=2+Math.random()*4}
 const nx=n.x+Math.sin(n.h)*n.v*dt,nz=n.z+Math.cos(n.h)*n.v*dt;
 if(canStand(nx,nz)){n.x=nx;n.z=nz;n.spd=n.v}else{n.h+=(Math.random()<.5?1:-1)*(1.2+Math.random()*1.6);n.spd=0}
 n.y+=(groundAt(n.x,n.z)-n.y)*Math.min(1,10*dt);n.rot=turnTo(n.rot,n.h,6*dt);
 n.m.position.set(n.x,n.y,n.z);n.m.rotation.y=n.rot;const near=Math.hypot(n.x-P.x,n.z-P.z)<150;n.m.visible=near;if(near)animate(n.m,dt,n.spd)}

// ===== Commandes : joystick (déplacement) + glisser (caméra) =====
let jx=0,jy=0,jid=null,yaw=0,pitch=.28,camDist=5.5,wantDist=5.5,lastDrag=-9;
const joy=document.getElementById('joy'),knob=document.getElementById('knob'),JR=44;
function joyMove(e){const b=joy.getBoundingClientRect();let dx=e.clientX-(b.left+b.width/2),dy=e.clientY-(b.top+b.height/2);
 const l=Math.hypot(dx,dy);if(l>JR){dx*=JR/l;dy*=JR/l}knob.style.transform='translate('+dx+'px,'+dy+'px)';
 jx=dx/JR;jy=-dy/JR;if(Math.hypot(jx,jy)<.12){jx=0;jy=0}}
joy.addEventListener('pointerdown',e=>{jid=e.pointerId;joy.setPointerCapture(jid);joyMove(e);e.preventDefault()});
joy.addEventListener('pointermove',e=>{if(e.pointerId===jid)joyMove(e)});
const joyEnd=e=>{if(e.pointerId!==jid)return;jid=null;jx=jy=0;knob.style.transform=''};
joy.addEventListener('pointerup',joyEnd);joy.addEventListener('pointercancel',joyEnd);
const el=r.domElement,ptrs=new Map();let pd=0;const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);pd=0});
el.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;const dx=e.clientX-p[0],dy=e.clientY-p[1];p[0]=e.clientX;p[1]=e.clientY;lastDrag=performance.now()/1000;
 if(ptrs.size===1){yaw-=dx*.005;pitch=clamp(pitch+dy*.003,-.3,1.45)}
 else if(ptrs.size===2){const a=[...ptrs.values()],d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);if(pd)wantDist=clamp(wantDist*pd/d,2.5,30);pd=d}});
const cEnd=e=>{ptrs.delete(e.pointerId);pd=0};el.addEventListener('pointerup',cEnd);el.addEventListener('pointercancel',cEnd);
document.addEventListener('gesturestart',e=>e.preventDefault());
function setScale(f){uf=Math.min(6,Math.max(.15,uf*f));try{localStorage.setItem('ny_scale',uf)}catch(e){}if(wrap){buildMap();spawn()}}
document.getElementById('bm').onclick=()=>setScale(.8);document.getElementById('bp').onclick=()=>setScale(1.25);
document.getElementById('bs').onclick=()=>{if(MAP)spawn()};

// ===== Caméra 3e personne =====
function updateCam(dt,now){
 const hx=P.x,hy=P.y+1.6,hz=P.z;
 if((jx||jy)&&jy>-.3&&now-lastDrag>1.2)yaw=turnTo(yaw,P.face+Math.PI,1.3*dt); // se replace doucement derrière le personnage
 const cp=Math.cos(pitch),dx=Math.sin(yaw)*cp,dy=Math.sin(pitch),dz=Math.cos(yaw)*cp;
 let d=wantDist;for(let t=.6;t<=wantDist;t+=.4){if(topAt(hx+dx*t,hz+dz*t)>hy+dy*t-.25){d=Math.max(1.1,t-.5);break}}
 camDist+=(d-camDist)*Math.min(1,(d<camDist?14:3)*dt);
 cam.position.set(hx+dx*camDist,hy+dy*camDist,hz+dz*camDist);
 const gy=groundAt(cam.position.x,cam.position.z)+.3;if(cam.position.y<gy)cam.position.y=gy;
 cam.lookAt(hx,hy+.5,hz)}

// ===== Chargement =====
function start(o){
 clean(o);o.updateMatrixWorld(true);
 let bx=new THREE.Box3().setFromObject(o);const c=bx.getCenter(new THREE.Vector3());
 o.position.x-=c.x;o.position.z-=c.z;o.position.y-=bx.min.y;o.updateMatrixWorld(true);
 const sz=bx.getSize(new THREE.Vector3());box0={x:sz.x,y:sz.y,z:sz.z};s0=TARGET/Math.max(sz.x,sz.z);
 const info=makeSlots(o,sz);lighten(o);
 wrap=new THREE.Group();const cc=(TILES-1)/2;
 for(let i=0;i<TILES;i++)for(let j=0;j<TILES;j++){const tg=new THREE.Group();
  tg.position.set((i-cc)*sz.x,0,(j-cc)*sz.z);tg.scale.set(Math.abs(i-cc)%2?-1:1,1,Math.abs(j-cc)%2?-1:1);
  if(i===cc&&j===cc)tg.add(o);else fillTile(tg,o,info);wrap.add(tg)}
 scene.add(wrap);buildMap();spawn();
 msg.textContent=MAP.free?'Aucune zone marchable détectée : essaie Échelle − / +':'Joystick = marcher · glisse = caméra · 2 doigts = zoom caméra';
 setTimeout(()=>msg.style.opacity=0,7000)}
tryLoad([R2+'new_york_city.glb',base+'Models/new_york_city.glb'],g=>start(g.scene),u=>{msg.textContent='Erreur de chargement : '+u},
 e=>{if(e.total)msg.textContent='Chargement New York '+Math.round(e.loaded/e.total*100)+'%'});

// ===== Boucle =====
onresize=()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)};
let tPrev=performance.now()/1000;
(function loop(){requestAnimationFrame(loop);const now=performance.now()/1000,dt=Math.min(.05,now-tPrev);tPrev=now;
 if(MAP){
  const m=Math.min(1,Math.hypot(jx,jy));
  if(m>0){const fx=-Math.sin(yaw),fz=-Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw);
   let mx=fx*jy+rx*jx,mz=fz*jy+rz*jx;const l=Math.hypot(mx,mz)||1;mx/=l;mz/=l;
   const v=m>.9?6:(1.5+m*2.5);P.spd=v;
   const sx=mx*v*dt,sz=mz*v*dt;if(canStand(P.x+sx,P.z))P.x+=sx;if(canStand(P.x,P.z+sz))P.z+=sz;
   P.face=turnTo(P.face,Math.atan2(mx,mz),10*dt)}else P.spd=0;
  P.y+=(groundAt(P.x,P.z)-P.y)*Math.min(1,12*dt);
  P.m.position.set(P.x,P.y,P.z);P.m.rotation.y=P.face;animate(P.m,dt,P.spd);
  npcs.forEach(n=>updateNPC(n,dt));updateCam(dt,now)}
 else{cam.position.set(0,60,120);cam.lookAt(0,0,0)}
 r.render(scene,cam)})();
