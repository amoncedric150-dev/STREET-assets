function treePositions(bark){ // un arbre = un amas de sommets d'écorce près du sol
 const v=new THREE.Vector3(),P=[];let minY=1e9;
 for(const c of bark){const a=c.geometry.attributes.position;for(let i=0;i<a.count;i++){v.fromBufferAttribute(a,i).applyMatrix4(c.matrixWorld);P.push(v.x,v.y,v.z);if(v.y<minY)minY=v.y}}

 for(let i=0;i<P.length;i+=3){if(P[i+1]>lowY)continue;const key=Math.floor(P[i]/cs)+','+Math.floor(P[i+2]/cs);let c=cells.get(key);
  if(!c){c={ix:Math.floor(P[i]/cs),iz:Math.floor(P[i+2]/cs),n:0,sx:0,sz:0,y:1e9,seen:false};cells.set(key,c)}c.n++;c.sx+=P[i];c.sz+=P[i+2];c.y=Math.min(c.y,P[i+1])}

  while(q.length){const c=q.pop();n+=c.n;sx+=c.sx;sz+=c.sz;y=Math.min(y,c.y);
   for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){const d=cells.get((c.ix+a)+','+(c.iz+b));if(d&&!d.seen){d.seen=true;q.push(d)}}}
  trees.push({lx:sx/n,lz:sz/n,ly:y,h:0,top:y})}

 for(let i=0;i<P.length;i+=3){let best=null,bd=R*R;for(const t of trees){const dx=P[i]-t.lx,dz=P[i+2]-t.lz,d=dx*dx+dz*dz;if(d<bd){bd=d;best=t}}if(best&&P[i+1]>best.top)best.top=P[i+1]}

function hideTrees(o){let n=0;const bark=[];o.traverse(c=>{if(!c.isMesh||!c.visible)return;const ms=[].concat(c.material);

 try{TREEPOS=treePositions(bark)}catch(e){TREEPOS=[]}return n}
function lighten(o){const v=new THREE.Vector3();o.traverse(c=>{if(!c.isMesh||!c.geometry)return;

// ===== Ville : new_york_city.glb répété en 3x3 (miroirs = routes qui se raccordent) =====
const TARGET=350,TILES=3; // largeur d'un bloc en mètres (échelle validée) et nombre de blocs par côté

let BUF=null,HH=null,HAS=null,WALK=null,SAFE=null,TMP=null,QQ=null;

// --- Variation : on échange des bâtiments du fichier entre eux (empreintes proches) ---
function findUnits(o){let n=o;for(let d=0;d<6;d++){while(n.children.length===1)n=n.children[0];if(n.children.length>=8)return n;
 let best=null,bc=0;n.children.forEach(c=>{const k=c.children.length;if(k>bc){bc=k;best=c}});if(!best)return null;n=best}return null}
function pathOf(o,n){const p=[];while(n!==o){p.unshift(n.parent.children.indexOf(n));n=n.parent}return p}
function nodeAt(o,p){let n=o;for(const k of p)n=n.children[k];return n}
function makeSlots(o,sz){const un=findUnits(o);if(!un)return null;const lim=Math.max(sz.x,sz.z),slots=[];
 un.children.forEach((c,k)=>{const b=new THREE.Box3().setFromObject(c);if(b.isEmpty())return;const v=b.getSize(new THREE.Vector3()),ct=b.getCenter(new THREE.Vector3());
  if(Math.max(v.x,v.z)<lim*.3&&v.y>lim*.04&&Math.abs(ct.x)<sz.x*.42&&Math.abs(ct.z)<sz.z*.42)slots.push({k,w:v.x,d:v.z,cx:ct.x,cz:ct.z,y0:b.min.y,mw:c.matrixWorld.clone()})});
 return slots.length>=6?{path:pathOf(o,un),slots}:null}
function fillTile(tg,o,info){const t=o.clone(true);tg.add(t);if(!info)return;const par=nodeAt(t,info.path),src=nodeAt(o,info.path),S=info.slots;
 for(const a of S){if(Math.random()>.55)continue;
  const cand=S.filter(b=>b!==a&&b.w<=a.w*1.1&&b.d<=a.d*1.1&&b.w>=a.w*.6&&b.d>=a.d*.6);if(!cand.length)continue;
  const b=pick(cand),c=src.children[b.k].clone(true),th=Math.random()<.5?0:Math.PI,m4=new THREE.Matrix4();
  const M=m4.makeTranslation(a.cx,a.y0,a.cz).multiply(new THREE.Matrix4().makeRotationY(th)).multiply(new THREE.Matrix4().makeTranslation(-b.cx,-b.y0,-b.cz)).multiply(b.mw);
  c.matrix.copy(M);c.matrixAutoUpdate=false;c.matrixWorldNeedsUpdate=true;par.children[a.k].visible=false;tg.add(c)}}

// --- Nouveaux arbres (tree_animate.glb) posés aux emplacements des anciens ; seuls ceux proches du joueur sont dessinés ---
const TREE_URL=R2+'tree_animate.glb',TREE_R=110,TREE_TRIS=200000; // TREE_TRIS = budget de triangles d'arbres affichés en même temps
let TMODEL=null,treeG=null,TALL=[],lastTX=1e9,lastTZ=1e9,HT=0;
function shrinkTex(t,max){if(!t||!t.image)return t;const im=t.image,w=im.width||im.naturalWidth,h=im.height||im.naturalHeight;
 if(!w||(w<=max&&h<=max))return t;const k=max/Math.max(w,h),c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*k));c.height=Math.max(1,Math.round(h*k));
 c.getContext('2d').drawImage(im,0,0,c.width,c.height);const n=t.clone();n.image=c;n.needsUpdate=true;return n}
function lightMat(m){if(!m)return;['map','alphaMap'].forEach(k=>{if(m[k])m[k]=shrinkTex(m[k],512)});
 ['normalMap','roughnessMap','metalnessMap','aoMap','emissiveMap','bumpMap','displacementMap'].forEach(k=>{if(m[k])m[k]=null});
 if('roughness' in m)m.roughness=.9;if('metalness' in m)m.metalness=0;m.needsUpdate=true}
function prepTree(root){root.updateMatrixWorld(true);const parts=[],box=new THREE.Box3();
 let tris=0;
 root.traverse(c=>{if(!c.isMesh||!c.geometry)return;const g=c.geometry.clone();tris+=(g.index?g.index.count:g.attributes.position.count)/3;
  [].concat(c.material).forEach(lightMat);
  [].concat(c.material).forEach(m=>{if(m&&m.map&&m.transparent){m.transparent=false;m.alphaTest=Math.max(m.alphaTest||0,.5);m.depthWrite=true}if(m)m.side=THREE.DoubleSide});g.deleteAttribute('skinIndex');g.deleteAttribute('skinWeight');g.applyMatrix4(c.matrixWorld);g.computeBoundingBox();box.union(g.boundingBox);parts.push({geo:g,mat:c.material})});
 const ct=box.getCenter(new THREE.Vector3());parts.forEach(p=>p.geo.translate(-ct.x,-box.min.y,-ct.z));
 return{parts,tris:Math.max(1,Math.round(tris)),H:Math.max(.001,box.max.y-box.min.y)}}
let DEAD=false;
function killTrees(e){if(DEAD)return;DEAD=true;
 try{if(treeG)scene.remove(treeG);treeG=null;TALL=[];TMODEL=null;
  if(wrap)wrap.traverse(c=>{if(c.isMesh){const ms=[].concat(c.material);if(ms.length&&ms.every(m=>m&&TREE_MAT.test(m.name||'')))c.visible=true}});
  setTimeout(()=>{if(MAP&&wrap)buildMap()},100)}catch(x){}
 msg.style.opacity=1;msg.textContent='Nouveaux arbres désactivés (erreur : '+((e&&e.message)||e)+')'}
function buildTrees(){try{return buildTrees0()}catch(e){killTrees(e);return 0}}
function buildTrees0(){
 if(DEAD)return 0;
 if(treeG){scene.remove(treeG);treeG.traverse(o=>{if(o.isInstancedMesh)o.dispose()})}
 treeG=new THREE.Group();TALL=[];if(!TMODEL||!TREEPOS.length||!MAP)return 0;
 const s=s0*uf,tw=box0.x*s,td=box0.z*s,cc=(TILES-1)/2;
 for(let a=-cc;a<=cc;a++)for(let b=-cc;b<=cc;b++){const sx=Math.abs(a)%2?-1:1,sz=Math.abs(b)%2?-1:1;
  for(const t of TREEPOS){const x=a*tw+sx*t.lx*s,z=b*td+sz*t.lz*s,y=t.ly*s,h=Math.min(16,Math.max(5,t.h*s))*(.9+Math.random()*.2);
   TALL.push({x,y,z,h,ry:Math.random()*6.28});
   const k=cellAt(x,z);if(k>=0)for(let di=-1;di<=1;di++)for(let dj=-1;dj<=1;dj++){const kk=k+di+dj*N;if(kk>=0&&kk<NN)MAP.walk[kk]=0}}}
 TMODEL.parts.forEach(p=>{const im=new THREE.InstancedMesh(p.geo,p.mat,TALL.length);im.frustumCulled=false;im.count=0;treeG.add(im)});
 scene.add(treeG);lastTX=1e9;updateTrees(true);return TALL.length}
const _m4=new THREE.Matrix4(),_q=new THREE.Quaternion(),_Y=new THREE.Vector3(0,1,0),_p=new THREE.Vector3(),_sc=new THREE.Vector3();
function updateTrees(force){try{updateTrees0(force)}catch(e){killTrees(e)}}
function updateTrees0(force){if(!treeG||!TALL.length)return;
 if(!force&&Math.hypot(P.x-lastTX,P.z-lastTZ)<40)return;lastTX=P.x;lastTZ=P.z;const R2=TREE_R*TREE_R,near=[];let n=0;
 for(const t of TALL){const dx=t.x-P.x,dz=t.z-P.z,d=dx*dx+dz*dz;if(d<=R2){t.d=d;near.push(t)}}
 near.sort((a,b)=>a.d-b.d);near.length=Math.min(near.length,Math.max(12,Math.floor(TREE_TRIS/TMODEL.tris)));
 for(const t of near){
  _m4.compose(_p.set(t.x,t.y,t.z),_q.setFromAxisAngle(_Y,t.ry),_sc.setScalar(t.h/TMODEL.H));
  treeG.children.forEach(im=>im.setMatrixAt(n,_m4));n++}
 treeG.children.forEach(im=>{im.count=n;im.instanceMatrix.needsUpdate=true})}
// --- Alentours : tuiles du fichier SANS bâtiments (routes + trottoirs du fichier) + maisons procédurales ---
const RING=0;                       // nombre d'anneaux de tuiles autour de la ville (1 = 5x5 au total)
let LOTS=[],houseG=null,outerG=null,HOUSES=[],HGRID=new Map(),EXT=0,TOPS=null;
const HC=10; // taille des cases de la grille de collision des maisons (m)
function findLots(o,sz){ // empreintes des bâtiments du fichier (repère de la tuile, échelle 1)
 const lim=Math.max(sz.x,sz.z),L=[],meshes=[],hide=[],b=new THREE.Box3(),v=new THREE.Vector3(),ct=new THREE.Vector3();
 o.traverse(c=>{if(c.isMesh&&c.geometry)meshes.push(c)});
 meshes.forEach((c,idx)=>{let vis=true;for(let p=c;p;p=p.parent)if(!p.visible){vis=false;break}if(!vis)return;
  b.setFromObject(c);if(b.isEmpty())return;b.getSize(v);b.getCenter(ct);
  if(v.y>lim*.022&&Math.max(v.x,v.z)<=lim*.35&&Math.min(v.x,v.z)>lim*.012){hide.push(idx);L.push({cx:ct.x,cz:ct.z,w:v.x,d:v.z,a:v.x*v.z})}});
 L.sort((p,q)=>q.a-p.a);const keep=[];
 for(const l of L){let cov=0;for(const k of keep){const ox=Math.min(l.cx+l.w/2,k.cx+k.w/2)-Math.max(l.cx-l.w/2,k.cx-k.w/2),oz=Math.min(l.cz+l.d/2,k.cz+k.d/2)-Math.max(l.cz-l.d/2,k.cz-k.d/2);
   if(ox>0&&oz>0)cov+=ox*oz;if(cov>l.a*.6)break}
  if(cov<=l.a*.6)keep.push(l)}
 return{lots:keep,hide}}
function roadOnlyTile(o,hide){const t=o.clone(true),m=[];t.traverse(c=>{if(c.isMesh&&c.geometry)m.push(c)});
 hide.forEach(i=>{if(m[i])m[i].visible=false});return t}
function addHouseRect(x,z,w,d,h){const r={x0:x-w/2,x1:x+w/2,z0:z-d/2,z1:z+d/2,h};HOUSES.push(r);
 for(let i=Math.floor(r.x0/HC);i<=Math.floor(r.x1/HC);i++)for(let j=Math.floor(r.z0/HC);j<=Math.floor(r.z1/HC);j++){const key=i+','+j;let a=HGRID.get(key);if(!a){a=[];HGRID.set(key,a)}a.push(r)}}
function houseAt(x,z,m){const a=HGRID.get(Math.floor(x/HC)+','+Math.floor(z/HC));if(!a)return null;
 for(const r of a)if(x>r.x0-m&&x<r.x1+m&&z>r.z0-m&&z<r.z1+m)return r;return null}
const HCOL=[0xe8dcc8,0xd9c7a6,0xc9d6dd,0xe4c9c0,0xb8c7a8,0xd8d0c0,0xcdb6a0,0xe9e4da,0xa9b9c9,0xd0a890];
const ROOFC=[0x7a3b2e,0x5a4a42,0x3f4650,0x8a5a3a,0x4a3a36];
function buildHouses(){
 if(houseG){scene.remove(houseG);houseG.traverse(o=>{if(o.isMesh)o.geometry.dispose()})}
 houseG=new THREE.Group();HOUSES=[];HGRID=new Map();
 if(!LOTS.length||!MAP){return 0}
 const s=s0*uf,tw=box0.x*s,td=box0.z*s,g=MAP.g-.3,M=[],GAP=2.5;
 const cc=(TILES-1)/2,R=(TILES-1)/2+RING;EXT=(TILES/2+RING)*Math.max(tw,td);
 for(let i=-R;i<=R;i++)for(let j=-R;j<=R;j++){
  if(Math.abs(i)<=cc&&Math.abs(j)<=cc)continue; // le centre reste New York
  const sx=Math.abs(i)%2?-1:1,sz=Math.abs(j)%2?-1:1,tx=i*tw,tz=j*td;
  for(const l of LOTS){const W=l.w*s,D=l.d*s,X=tx+sx*l.cx*s,Z=tz+sz*l.cz*s;
   const nx=Math.max(1,Math.round(W/13)),nz=Math.max(1,Math.round(D/12));
